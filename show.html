<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title id="mainTitle">号码展示</title>
<style>
:root{
  --ball: clamp(36px, 8.6vw, 52px);
  --gap: clamp(3px, 1.1vw, 8px);
  --cy:#22d3ee; --pk:#f43f5e; --vi:#8b5cf6;
  --mx:50vw; --my:30vh;
  --mono: ui-monospace,'SF Mono','Cascadia Code',Consolas,'Courier New',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Arial,sans-serif;
  min-height:100vh;display:flex;justify-content:center;align-items:flex-start;
  padding:clamp(12px,3vw,40px) clamp(10px,2.5vw,24px);
  color:#dbe7ff;background:#03040a;overflow-x:hidden;-webkit-font-smoothing:antialiased;
}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
/* 透视网格地面 */
.floor{position:fixed;left:-50%;right:-50%;bottom:-12vh;height:62vh;z-index:0;pointer-events:none;
  background:
    linear-gradient(rgba(34,211,238,.35) 1px,transparent 1px) 0 0/60px 60px,
    linear-gradient(90deg,rgba(139,92,246,.35) 1px,transparent 1px) 0 0/60px 60px;
  transform:perspective(420px) rotateX(64deg);transform-origin:50% 100%;
  -webkit-mask-image:linear-gradient(to top,#000 5%,transparent 78%);mask-image:linear-gradient(to top,#000 5%,transparent 78%);
  animation:floorMove 2.4s linear infinite;opacity:.55}
@keyframes floorMove{to{background-position:0 60px,60px 0}}
/* 鼠标光晕 */
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(520px circle at var(--mx) var(--my),rgba(34,211,238,.16),rgba(139,92,246,.09) 40%,transparent 70%)}
/* 全屏扫描线 */
body::after{content:'';position:fixed;inset:0;z-index:5;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);mix-blend-mode:overlay}

.stage{position:relative;z-index:2;width:100%;max-width:620px;perspective:1400px}
.container{
  position:relative;width:100%;
  padding:clamp(20px,4vw,34px) clamp(12px,3vw,26px) clamp(20px,4vw,30px);
  border-radius:clamp(18px,3.4vw,26px);
  background:linear-gradient(168deg,rgba(14,20,44,.82),rgba(5,7,18,.9));
  backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
  box-shadow:0 40px 100px -30px #000,0 0 120px -40px rgba(34,211,238,.55),inset 0 1px 0 rgba(255,255,255,.14);
  animation:cardIn .9s cubic-bezier(.2,.9,.3,1) both;
  transform-style:preserve-3d;transition:transform .25s ease-out;
}
/* 旋转流光边框 */
.container::before{
  content:'';position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;z-index:0;
  background:conic-gradient(from var(--a,0deg),transparent 0 55%,var(--cy) 72%,var(--vi) 84%,var(--pk) 92%,transparent 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
  animation:spin 5s linear infinite;pointer-events:none}
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes spin{to{--a:360deg}}
@keyframes cardIn{from{opacity:0;transform:translateY(34px) rotateX(14deg) scale(.96)}to{opacity:1;transform:none}}
/* HUD 四角 */
.c{position:absolute;width:18px;height:18px;border:2px solid var(--cy);filter:drop-shadow(0 0 6px var(--cy));z-index:2;pointer-events:none;animation:blink 3s ease-in-out infinite}
.c.tl{top:10px;left:10px;border-right:0;border-bottom:0}
.c.tr{top:10px;right:10px;border-left:0;border-bottom:0}
.c.bl{bottom:10px;left:10px;border-right:0;border-top:0}
.c.br{bottom:10px;right:10px;border-left:0;border-top:0}
@keyframes blink{50%{opacity:.45}}
/* 大扫描光束 */
.beam{position:absolute;left:0;right:0;height:90px;top:-90px;z-index:1;pointer-events:none;border-radius:inherit;
  background:linear-gradient(180deg,transparent,rgba(34,211,238,.10),rgba(34,211,238,.28) 92%,transparent);
  animation:beam 6s ease-in-out infinite}
@keyframes beam{0%{top:-90px;opacity:0}8%{opacity:1}55%{top:100%;opacity:1}60%,100%{top:100%;opacity:0}}
#content{position:relative;z-index:3}

.hud{display:flex;justify-content:space-between;align-items:center;font:600 10px var(--mono);letter-spacing:2px;color:#5eead4;opacity:.85;margin:-6px 6px 12px}
.hud i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#34d399;box-shadow:0 0 10px 2px #34d399;margin-right:6px;animation:blink 1.2s infinite}

h1{
  position:relative;text-align:center;font-size:clamp(19px,4.8vw,27px);font-weight:800;letter-spacing:.5px;line-height:1.35;
  cursor:pointer;user-select:none;
  background:linear-gradient(100deg,#fff 0%,#a5f3fc 25%,#c4b5fd 50%,#fda4af 72%,#fff 95%);background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  filter:drop-shadow(0 0 18px rgba(34,211,238,.5));animation:shine 6s linear infinite;
  transition:transform .35s cubic-bezier(.2,.9,.3,1.4)}
h1:hover{transform:scale(1.03)}h1:active{transform:scale(.98)}
h1::before,h1::after{content:attr(data-text);position:absolute;inset:0;-webkit-text-fill-color:initial;background:none;opacity:0;pointer-events:none}
h1::before{color:#22d3ee;clip-path:inset(0 0 55% 0);animation:glitchA 5s infinite}
h1::after{color:#f43f5e;clip-path:inset(55% 0 0 0);animation:glitchB 5s infinite}
@keyframes shine{to{background-position:250% 50%}}
@keyframes glitchA{0%,92%,100%{opacity:0;transform:none}93%{opacity:.9;transform:translate(-3px,-1px)}95%{opacity:.9;transform:translate(3px,1px)}97%{opacity:0}}
@keyframes glitchB{0%,93%,100%{opacity:0;transform:none}94%{opacity:.9;transform:translate(3px,1px)}96%{opacity:.9;transform:translate(-3px,0)}98%{opacity:0}}

.subtitle{text-align:center;font:500 clamp(11px,3vw,13px) var(--mono);letter-spacing:3px;color:#7dd3fc;margin:10px 0 clamp(18px,3.4vw,26px);min-height:1.4em}
.subtitle::after{content:'▌';margin-left:3px;animation:blink .9s steps(2) infinite;color:var(--cy)}

.number-group{
  position:relative;text-align:center;overflow:hidden;
  padding:clamp(14px,2.8vw,20px) clamp(10px,2.4vw,18px) clamp(16px,3vw,22px);
  margin-bottom:clamp(12px,2.4vw,16px);border-radius:clamp(14px,3vw,18px);
  background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.015));
  border:1px solid rgba(125,211,252,.14);
  box-shadow:0 14px 34px -22px #000,inset 0 1px 0 rgba(255,255,255,.08);
  animation:groupIn .7s cubic-bezier(.2,.9,.3,1) backwards;
  transform-style:preserve-3d;transition:transform .2s ease-out,border-color .3s,box-shadow .3s;
}
.number-group:last-child{margin-bottom:0}
.number-group:hover{border-color:rgba(34,211,238,.5);box-shadow:0 18px 40px -20px #000,0 0 36px -10px rgba(34,211,238,.55),inset 0 1px 0 rgba(255,255,255,.12)}
/* 鼠标跟随高光 */
.number-group::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(260px circle at var(--gx,50%) var(--gy,0%),rgba(34,211,238,.18),transparent 65%);opacity:0;transition:opacity .3s}
.number-group:hover::before{opacity:1}
/* 横向扫光 */
.number-group::after{content:'';position:absolute;top:0;bottom:0;width:40%;left:-60%;pointer-events:none;z-index:0;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.10),transparent);transform:skewX(-18deg);
  animation:sweep 5.5s ease-in-out infinite;animation-delay:var(--sd,0s)}
@keyframes sweep{0%,60%{left:-60%}100%{left:130%}}
@keyframes groupIn{from{opacity:0;transform:translateX(-26px) rotateY(-12deg)}to{opacity:1;transform:none}}

.group-title{
  position:relative;z-index:1;display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none;
  font:700 clamp(10px,2.6vw,11.5px) var(--mono);letter-spacing:2px;color:#a5f3fc;
  padding:4px 14px;border-radius:4px;margin-bottom:clamp(12px,2.4vw,16px);
  background:linear-gradient(135deg,rgba(34,211,238,.14),rgba(139,92,246,.12));
  border:1px solid rgba(34,211,238,.35);
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
  transition:filter .2s}
.group-title:hover{filter:brightness(1.4)}
.group-title::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--cy);box-shadow:0 0 8px 2px var(--cy);animation:blink 1.6s infinite}

.numbers-container{position:relative;z-index:1;display:flex;justify-content:center;align-items:center;flex-wrap:nowrap;gap:var(--gap);width:100%}
.numbers-container.compact{gap:calc(var(--gap)*.7)}
.numbers-container.kl8-grid{display:grid;grid-template-columns:repeat(5,1fr);justify-items:center;row-gap:clamp(8px,2vw,14px);column-gap:var(--gap)}

.number-ball{
  --c:var(--pk);
  position:relative;isolation:isolate;width:var(--ball);height:var(--ball);border-radius:50%;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  font:800 calc(var(--ball)*.44)/1 var(--mono);letter-spacing:-.5px;color:#fff;font-variant-numeric:tabular-nums;
  animation:popIn .8s cubic-bezier(.18,1.4,.4,1) backwards,float 4s ease-in-out infinite;
  animation-delay:var(--d,0s),calc(var(--d,0s) + .8s);
  transition:transform .3s cubic-bezier(.2,.9,.3,1.5),filter .3s;cursor:pointer;will-change:transform}
.number-ball.small{width:calc(var(--ball)*.94);height:calc(var(--ball)*.94);font-size:calc(var(--ball)*.42)}
.number-ball.red{--c:#ff2d63;
  background:radial-gradient(circle at 32% 24%,rgba(255,255,255,.35),transparent 34%),radial-gradient(circle at 50% 118%,rgba(255,150,185,.7),transparent 55%),radial-gradient(circle at 50% 40%,#f2527a 0%,#d91246 40%,#8e0934 72%,#3d0014 100%);
  box-shadow:0 10px 26px -8px rgba(255,45,99,.9),0 0 34px -4px rgba(255,45,99,.5),inset 0 -8px 16px -4px rgba(70,0,20,.75),inset 0 0 0 1px rgba(255,255,255,.12)}
.number-ball.blue{--c:#22d3ee;
  background:radial-gradient(circle at 32% 24%,rgba(255,255,255,.38),transparent 34%),radial-gradient(circle at 50% 118%,rgba(150,235,255,.75),transparent 55%),radial-gradient(circle at 50% 40%,#63d6f5 0%,#159ad8 40%,#0b5aa8 72%,#03204f 100%);
  box-shadow:0 10px 26px -8px rgba(34,211,238,.9),0 0 34px -4px rgba(34,211,238,.55),inset 0 -8px 16px -4px rgba(0,25,60,.75),inset 0 0 0 1px rgba(255,255,255,.14)}
/* 旋转能量环 */
.number-ball::before{content:'';position:absolute;inset:-5px;border-radius:50%;z-index:-1;
  background:conic-gradient(from var(--a,0deg),transparent 0 50%,var(--c) 85%,#fff 100%);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1.5px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1.5px));
  animation:spin 2.8s linear infinite;opacity:.9;filter:drop-shadow(0 0 4px var(--c))}
.number-ball > span{position:relative;z-index:2;text-shadow:0 1px 2px rgba(0,0,0,.8),0 0 6px rgba(0,0,0,.55)}
/* 玻璃高光 */
.number-ball::after{content:'';position:absolute;top:7%;left:14%;width:34%;height:24%;border-radius:50%;
  background:radial-gradient(circle at 45% 42%,rgba(255,255,255,.4),rgba(255,255,255,0) 72%);filter:blur(1.2px);transform:rotate(-22deg);pointer-events:none;z-index:1}
.number-ball:hover{transform:translateY(-6px) scale(1.12);filter:brightness(1.18) saturate(1.1);z-index:6}
.number-ball.lock{animation:popIn .8s cubic-bezier(.18,1.4,.4,1) backwards,float 4s ease-in-out infinite,lock .5s ease-out}
@keyframes lock{0%{filter:brightness(2.2)}100%{filter:none}}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -3px}}
@keyframes popIn{0%{transform:scale(.2) rotate(-120deg);opacity:0}55%{transform:scale(1.15) rotate(8deg);opacity:1}80%{transform:scale(.96)}100%{transform:none;opacity:1}}

.separator{width:2px;height:calc(var(--ball)*.64);flex-shrink:0;margin:0 calc(var(--gap)*.8);border-radius:2px;
  background:linear-gradient(to bottom,transparent,var(--cy),transparent);box-shadow:0 0 12px var(--cy);animation:blink 1.8s infinite}
.separator.compact{margin:0 calc(var(--gap)*.5)}

.foot{position:relative;z-index:3;text-align:center;margin-top:16px;font:500 10px var(--mono);letter-spacing:2px;color:#64748b}

.burst{position:fixed;width:5px;height:5px;border-radius:50%;pointer-events:none;z-index:9998;animation:burst .8s ease-out forwards}
@keyframes burst{to{transform:translate(var(--x),var(--y)) scale(0);opacity:0}}

.copy-toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:14px 26px;border-radius:12px;
  font:600 15px var(--mono);letter-spacing:.5px;color:#e6fffb;background:rgba(6,12,28,.92);
  border:1px solid rgba(34,211,238,.55);box-shadow:0 20px 60px -12px #000,0 0 40px -6px rgba(34,211,238,.7);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:9999;animation:toastIn 1.6s cubic-bezier(.2,.9,.3,1) both}
@keyframes toastIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.85)}14%,80%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(.96)}}

.error-container{text-align:center;padding:clamp(36px,8vw,56px) 16px}
.error-message{display:inline-block;max-width:100%;padding:18px 28px;border-radius:12px;font:14px var(--mono);letter-spacing:.5px;color:#fca5a5;
  background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.4);box-shadow:0 0 40px -12px rgba(239,68,68,.7)}
.error-message::before{content:'⚠';display:block;font-size:26px;margin-bottom:10px;color:#f87171}

@media (max-width:480px){.container{padding:22px 12px 24px}.number-group{padding:14px 10px 16px}.separator{height:calc(var(--ball)*.58)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="floor"></div>
<div class="stage" id="stage">
  <div class="container" id="card">
    <i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i>
    <div class="beam"></div>
    <div id="content">
      <div class="hud"><span><i></i>SYS ONLINE</span><span id="clock">--:--:--</span></div>
      <h1 id="pageTitle" data-text="号码展示">号码展示</h1>
      <p class="subtitle" id="subtitle"></p>
      <div id="numbersContainer"></div>
      <div class="foot">TAP TITLE · COPY ALL &nbsp;//&nbsp; TAP GROUP · COPY ONE</div>
    </div>
  </div>
</div>

<script>
const B64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
const SSQ_BITS = [6,6,6,6,6,6, 5];
const DLT_BITS = [6,6,6,6,6, 4,4,4];
const KL8_BITS = [7,7,7,7,7,7,7,7,7,7];

function getSchema(type) {
    if (type === 'ssq') return SSQ_BITS;
    if (type === 'dlt') return DLT_BITS;
    if (type === 'kl8') return KL8_BITS;
    return null;
}
function charsPerGroup(type) {
    const bits = getSchema(type).reduce((a, b) => a + b, 0);
    return Math.ceil(bits / 6);
}
function _unpack(str, bitLens) {
    let bits = [...str].map(c => B64.indexOf(c).toString(2).padStart(6, '0')).join('');
    let pos = 0;
    return bitLens.map(len => { const v = parseInt(bits.slice(pos, pos + len), 2); pos += len; return v; });
}
function decodeGroups(type, data) {
    const schema = getSchema(type);
    const groupChars = charsPerGroup(type);
    const groups = [];
    for (let i = 0; i + groupChars <= data.length; i += groupChars) {
        const values = _unpack(data.slice(i, i + groupChars), schema);
        if (type === 'dlt') groups.push(values[7] === 0 ? values.slice(0, 7) : values.slice(0, 8));
        else groups.push(values);
    }
    return groups;
}

let globalNumbers = null;

function parseNumbers() {
    const params = new URLSearchParams(window.location.search);
    let type, numbers;
    if (params.has('t') && params.has('v')) {
        const t = params.get('t');
        type = t === 's' ? 'ssq' : t === 'd' ? 'dlt' : t === 'k' ? 'kl8' : null;
        if (!type) { showError('无效的彩票类型参数'); return null; }
        const v = params.get('v');
        if (!v || v.length % charsPerGroup(type) !== 0) { showError('URL 数据格式错误'); return null; }
        numbers = decodeGroups(type, v);
        if (!numbers.length) { showError('无法解码号码数据'); return null; }
    } else if (params.has('type') && params.has('data')) {
        type = params.get('type');
        if (type !== 'ssq' && type !== 'dlt' && type !== 'kl8') { showError('未知的彩票类型'); return null; }
        numbers = params.get('data').split('|').map(g => g.split(',').map(n => parseInt(n)));
    } else { showError('无效的 URL 参数'); return null; }
    globalNumbers = { type, numbers };
    return globalNumbers;
}

function renderNumbers() {
    const result = parseNumbers();
    if (!result) return;
    const { type, numbers } = result;
    const pageTitle = document.getElementById('pageTitle');
    const subtitle = document.getElementById('subtitle');
    const container = document.getElementById('numbersContainer');

    const now = new Date();
    const weekDays = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
    const prefix = `${now.getMonth() + 1}月${now.getDate()}日 ${weekDays[now.getDay()]}`;
    let title, sub;
    if (type === 'ssq') { title = `${prefix} 双色球号码`; sub = '6 个红球 · 1 个蓝球'; }
    else if (type === 'dlt') { title = `${prefix} 大乐透号码`; sub = '5 个前区 · 2~3 个后区'; }
    else { title = `${prefix} 快乐八号码`; sub = '10 个红球'; }
    document.getElementById('mainTitle').textContent = title;
    pageTitle.textContent = title;
    pageTitle.dataset.text = title;
    typeWrite(subtitle, sub);

    pageTitle.onclick = copyAllNumbers;
    container.innerHTML = '';

    numbers.forEach((group, index) => {
        const groupDiv = document.createElement('div');
        groupDiv.className = 'number-group';
        groupDiv.style.animationDelay = `${index * 0.1}s`;
        groupDiv.style.setProperty('--sd', `${index * 0.6}s`);

        const titleEl = document.createElement('div');
        titleEl.className = 'group-title';
        titleEl.textContent = `NO.${String(index + 1).padStart(2, '0')} · 第 ${index + 1} 组`;
        titleEl.title = '点击复制本组';
        titleEl.onclick = () => copyText(group.map(n => n.toString().padStart(2, '0')).join(' '), `✅ 第 ${index + 1} 组已复制`);
        groupDiv.appendChild(titleEl);

        const isCompact = (type === 'dlt' && group.length === 8);
        const nc = document.createElement('div');
        nc.className = 'numbers-container' + (isCompact ? ' compact' : '') + (type === 'kl8' ? ' kl8-grid' : '');
        const base = index * 0.1;

        if (type === 'ssq') {
            for (let i = 0; i < 6; i++) nc.appendChild(createBall(group[i], 'red', false, base + i * 0.07));
            nc.appendChild(createSeparator(false));
            nc.appendChild(createBall(group[6], 'blue', false, base + 0.44));
        } else if (type === 'dlt') {
            for (let i = 0; i < 5; i++) nc.appendChild(createBall(group[i], 'red', isCompact, base + i * 0.06));
            nc.appendChild(createSeparator(isCompact));
            for (let i = 5; i < group.length; i++) nc.appendChild(createBall(group[i], 'blue', isCompact, base + i * 0.06));
        } else {
            for (let i = 0; i < group.length; i++) nc.appendChild(createBall(group[i], 'red', false, base + i * 0.05));
        }
        groupDiv.appendChild(nc);
        container.appendChild(groupDiv);
        bindTilt(groupDiv, 6);
    });
}

function createBall(number, type, small, delay) {
    const ball = document.createElement('div');
    ball.className = `number-ball ${type}${small ? ' small' : ''}`;
    ball.style.setProperty('--d', `${delay}s`);
    const span = document.createElement('span');
    const final = number.toString().padStart(2, '0');
    span.textContent = '00';
    ball.appendChild(span);
    scramble(span, final, delay * 1000 + 250, ball);
    ball.addEventListener('click', e => { burst(e.clientX, e.clientY, getComputedStyle(ball).getPropertyValue('--c')); });
    return ball;
}

/* 数字乱码滚动 → 锁定 */
function scramble(el, final, delay, ball) {
    const t0 = performance.now() + delay, dur = 700 + Math.random() * 400;
    (function tick(t) {
        if (t < t0) return requestAnimationFrame(tick);
        if (t - t0 >= dur) { el.textContent = final; ball.classList.add('lock'); return; }
        el.textContent = String(Math.floor(Math.random() * 100)).padStart(2, '0');
        requestAnimationFrame(tick);
    })(performance.now());
}

function typeWrite(el, text) {
    el.textContent = ''; let i = 0;
    const id = setInterval(() => { el.textContent = text.slice(0, ++i); if (i >= text.length) clearInterval(id); }, 70);
}

function createSeparator(compact) {
    const sep = document.createElement('div');
    sep.className = 'separator' + (compact ? ' compact' : '');
    return sep;
}

/* 3D 倾斜 + 跟随高光 */
function bindTilt(el, max) {
    el.addEventListener('pointermove', e => {
        const r = el.getBoundingClientRect();
        const px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
        el.style.transform = `perspective(700px) rotateX(${(.5 - py) * max}deg) rotateY(${(px - .5) * max}deg)`;
        el.style.setProperty('--gx', px * 100 + '%'); el.style.setProperty('--gy', py * 100 + '%');
    });
    el.addEventListener('pointerleave', () => { el.style.transform = ''; });
}

function burst(x, y, color) {
    for (let i = 0; i < 14; i++) {
        const p = document.createElement('i'); p.className = 'burst';
        const a = Math.random() * Math.PI * 2, d = 30 + Math.random() * 50;
        p.style.cssText = `left:${x}px;top:${y}px;background:${color};box-shadow:0 0 8px ${color};--x:${Math.cos(a) * d}px;--y:${Math.sin(a) * d}px`;
        document.body.appendChild(p); setTimeout(() => p.remove(), 850);
    }
}

function copyAllNumbers() {
    if (!globalNumbers || !globalNumbers.numbers) { showToast('暂无号码可复制'); return; }
    copyText(globalNumbers.numbers.map(g => g.map(n => n.toString().padStart(2, '0')).join(' ')).join('\n'), '✅ 已复制全部号码到剪贴板');
}

function copyText(text, okMsg) {
    const done = () => showToast(okMsg);
    const fail = () => showToast('❌ 复制失败，请重试');
    function fallbackCopy() {
        try {
            const ta = document.createElement('textarea');
            ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
            document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
            done();
        } catch (e) { fail(); }
    }
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done).catch(fallbackCopy);
    else fallbackCopy();
}

function showToast(msg) {
    const toast = document.createElement('div');
    toast.className = 'copy-toast'; toast.textContent = msg;
    document.body.appendChild(toast);
    setTimeout(() => { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 1650);
}

function showError(message) {
    document.getElementById('content').innerHTML = `<div class="error-container"><div class="error-message">${message}</div></div>`;
}

/* 时钟 */
(function clock() {
    const el = document.getElementById('clock');
    const f = () => el && (el.textContent = new Date().toTimeString().slice(0, 8));
    f(); setInterval(f, 1000);
})();

/* 鼠标 / 陀螺仪视差 */
const card = document.getElementById('card');
const mouse = { x: innerWidth / 2, y: innerHeight * .3 };
addEventListener('pointermove', e => {
    mouse.x = e.clientX; mouse.y = e.clientY;
    document.documentElement.style.setProperty('--mx', e.clientX + 'px');
    document.documentElement.style.setProperty('--my', e.clientY + 'px');
    if (e.pointerType === 'mouse') {
        const rx = (e.clientY / innerHeight - .5) * -5, ry = (e.clientX / innerWidth - .5) * 7;
        card.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`;
    }
});

/* 粒子星网背景 */
(function fx() {
    const cv = document.getElementById('fx'), ctx = cv.getContext('2d');
    let W, H, dpr, ps = [];
    function resize() {
        dpr = Math.min(devicePixelRatio || 1, 2);
        W = cv.width = innerWidth * dpr; H = cv.height = innerHeight * dpr;
        const n = Math.min(110, Math.floor(innerWidth * innerHeight / 14000));
        ps = Array.from({ length: n }, () => ({
            x: Math.random() * W, y: Math.random() * H,
            vx: (Math.random() - .5) * .4 * dpr, vy: (Math.random() - .5) * .4 * dpr,
            r: (Math.random() * 1.4 + .6) * dpr, h: Math.random() < .5 ? 190 : 285
        }));
    }
    resize(); addEventListener('resize', resize);
    const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
    function frame() {
        ctx.clearRect(0, 0, W, H);
        const mx = mouse.x * dpr, my = mouse.y * dpr, L = 140 * dpr;
        for (let i = 0; i < ps.length; i++) {
            const p = ps[i];
            if (!reduce) { p.x += p.vx; p.y += p.vy; }
            if (p.x < 0 || p.x > W) p.vx *= -1;
            if (p.y < 0 || p.y > H) p.vy *= -1;
            const dx = p.x - mx, dy = p.y - my, dm = Math.hypot(dx, dy);
            if (dm < 160 * dpr && dm > 1) { p.x += dx / dm * 1.2; p.y += dy / dm * 1.2; }
            ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283);
            ctx.fillStyle = `hsla(${p.h},95%,70%,.85)`; ctx.shadowBlur = 8 * dpr; ctx.shadowColor = `hsl(${p.h},95%,60%)`; ctx.fill();
            ctx.shadowBlur = 0;
            for (let j = i + 1; j < ps.length; j++) {
                const q = ps[j], d = Math.hypot(p.x - q.x, p.y - q.y);
                if (d < L) {
                    ctx.strokeStyle = `hsla(${p.h},90%,65%,${(1 - d / L) * .28})`; ctx.lineWidth = dpr;
                    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
                }
            }
        }
        requestAnimationFrame(frame);
    }
    frame();
})();

renderNumbers();
